services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: section_l_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d section_l_development"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: section_l_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      FRONTEND_ORIGIN: http://localhost:5173
      RAILS_DEVELOPMENT_HOST: backend
      STAFF_CONFIG_PIN: ${STAFF_CONFIG_PIN}
    command:
      - bash
      - -lc
      - bin/rails db:prepare && bin/rails db:seed && exec bin/rails server -b 0.0.0.0 -p 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:3000
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
